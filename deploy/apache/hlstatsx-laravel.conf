RedirectMatch 301 ^/laravel/?$ https://stats.lamateam.eu/
RedirectMatch 301 ^/laravel/(.*)$ https://stats.lamateam.eu/$1
Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge

<Directory /opt/hlstatsx-laravel/current/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require expr "%{HTTP_HOST} == 'stats.lamateam.eu' || %{HTTP_HOST} == 'www.lamateam.eu' || %{HTTP_HOST} == 'lamateam.eu'"
</Directory>

<Directory /var/www/html/.well-known/acme-challenge>
    Options None
    AllowOverride None
    Require all granted
</Directory>

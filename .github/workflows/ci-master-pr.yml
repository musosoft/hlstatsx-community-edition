name: ci-dev-pr

on:
  push:
    branches:
    - dev
    tags:
    - '**'
  pull_request:
    branches:
    - dev

jobs:
  test:
    strategy:
      matrix:
        testenv:
          - dev
          - prod
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Build PHP heatmap runtime
      if: matrix.testenv == 'dev'
      run: |
        set -eu
        docker build -f Dockerfile.heatmaps -t hlstatsx-heatmaps-ci .
        docker run --rm \
          --mount type=bind,source="$PWD",target=/tmp/hlx-source,readonly \
          --workdir /tmp/hlx-source \
          hlstatsx-heatmaps-ci php test/test_php85_compatibility.php
        network=hlx-laravel-ci
        laravel_db=hlx-laravel-ci-db
        cleanup() {
          docker rm -f "$laravel_db" >/dev/null 2>&1 || true
          docker network rm "$network" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        docker network create "$network" >/dev/null
        docker build -t hlstatsx-laravel-ci src/laravel
        for attempt in 1 2 3 4 5; do
          if docker pull mariadb:10.11; then
            break
          fi
          if [ "$attempt" -eq 5 ]; then
            echo "Unable to pull mariadb:10.11 after $attempt attempts" >&2
            exit 1
          fi
          sleep "$((attempt * 5))"
        done
        docker run -d --name "$laravel_db" --network "$network" --network-alias laravel-db \
          --pull=never \
          -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 \
          -e MARIADB_DATABASE=admin_accounts_test \
          mariadb:10.11 >/dev/null
        ready=0
        for attempt in $(seq 1 90); do
          if docker run --rm --network "$network" --entrypoint php hlstatsx-laravel-ci \
            -r '$socket = @fsockopen("laravel-db", 3306); if (! $socket) { exit(1); } fclose($socket);' \
            >/dev/null 2>&1; then
            ready=1
            break
          fi
          if [ "$attempt" -eq 90 ]; then
            echo "MariaDB TCP endpoint did not become ready after $attempt attempts" >&2
          fi
          sleep 2
        done
        test "$ready" = 1
        docker run --rm --network "$network" \
          -e APP_ENV=testing \
          -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
          -e ADMIN_TEST_MYSQL_HOST=laravel-db \
          -e ADMIN_TEST_MYSQL_ALLOW_RESET=1 \
          --entrypoint sh \
          hlstatsx-laravel-ci -ec 'php tests/admin_accounts.php && php tests/migration_preflight.php && php tests/view_rendering.php'

    # - name: Set up Docker Buildx
    #   id: buildx
    #   uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers (daemon)
      uses: actions/cache/restore@v6.1.0  # Don't save the cache at end of job
      with:
        path: /tmp/.buildx-cache-daemon
        key: ${{ runner.os }}-buildx-daemon-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-daemon-
          ${{ runner.os }}-buildx-

    - name: Cache Docker layers (Laravel and heatmaps)
      uses: actions/cache/restore@v6.1.0  # Don't save the cache at end of job
      with:
        path: /tmp/.buildx-cache-laravel
        key: ${{ runner.os }}-buildx-laravel-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-laravel-
          ${{ runner.os }}-buildx-

    - name: Daemon Perl regression tests
      if: matrix.testenv == 'dev'
      run: |
        set -eu
        docker build --target dev -f Dockerfile.daemon -t hlstatsx-daemon-ci .
        docker run --rm \
          --mount type=bind,source="$PWD",target=/workspace,readonly \
          --workdir /workspace \
          --entrypoint prove \
          hlstatsx-daemon-ci -v \
          test/test_daemon_timestamp.t \
          test/test_hlstats_ftp.t \
          test/test_hlx_atb_policy.pl \
          test/test_proxy_daemon_envelope.t

    - name: Print buildx and compose
      run: |
        set -eu
        docker buildx ls
        docker compose version

    - name: Integration test (dev)
      if: matrix.testenv == 'dev'
      run: |
        set -eux
        HLX_TEST_MYSQL_IMAGE=mysql:26.10 ./test/test.sh dev 1

    - name: Integration test (prod)
      if: matrix.testenv == 'prod'
      run: |
        set -eux
        ./test/test.sh prod 1

  build:
    env:
      DOCKERHUB_REGISTRY_USER: ${{ secrets.DOCKERHUB_REGISTRY_USER }}
      DOCKERHUB_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_REGISTRY_PASSWORD }}
    strategy:
      matrix:
        include:
          - variant: daemon
            context: .
            dockerfile: Dockerfile.daemon
            target: prod
            platforms: linux/amd64
          - variant: heatmaps
            context: .
            dockerfile: Dockerfile.heatmaps
            target: ''
            platforms: linux/amd64,linux/arm64
          - variant: laravel
            context: ./src/laravel
            dockerfile: src/laravel/Dockerfile
            target: ''
            platforms: linux/amd64
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Display system info (linux)
      run: |
        set -e
        hostname
        whoami
        cat /etc/*release
        lscpu
        free
        df -h
        pwd
        docker info
        docker version

    # See: https://github.com/docker/build-push-action/blob/v2.6.1/docs/advanced/cache.md#github-cache
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4.4.0

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Cache Docker layers
      uses: actions/cache@v6.1.0
      with:
        path: /tmp/.buildx-cache-${{ matrix.variant }}
        key: ${{ runner.os }}-buildx-${{ matrix.variant }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-${{ matrix.variant }}-
          ${{ runner.os }}-buildx-

    # This step generates the docker tags
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: |
          ${{ github.repository }}
        # type=ref,event=pr generates tag(s) on PRs only. E.g. 'pr-123-<variant>', 'pr-123-abc0123-<variant>'
        # type=ref,event=branch generates tag(s) on branch only. E.g. 'master-<variant>', 'master-abc0123-<variant>'
        # type=ref,event=tag generates tag(s) on tags only. E.g. 'v0.0.0-<variant>', 'v0.0.0-abc0123-<variant>'
        tags: |
          type=ref,suffix=-${{ matrix.variant }},event=pr
          type=ref,suffix=-{{sha}}-${{ matrix.variant }},event=pr
          type=ref,suffix=-${{ matrix.variant }},event=branch
          type=ref,suffix=-{{sha}}-${{ matrix.variant }},event=branch
          type=semver,pattern={{major}},suffix=-${{ matrix.variant }}
          type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.variant }}
          type=semver,pattern={{major}}.{{minor}}.{{patch}},suffix=-${{ matrix.variant }}
        # Disable 'latest' tag
        flavor: |
          latest=false

    - name: Login to Docker Hub registry
      # Publish only when Docker Hub credentials are configured.
      if: >-
        (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')) &&
        env.DOCKERHUB_REGISTRY_USER != '' &&
        env.DOCKERHUB_REGISTRY_PASSWORD != ''
      uses: docker/login-action@v4.7.0
      with:
        username: ${{ secrets.DOCKERHUB_REGISTRY_USER }}
        password: ${{ secrets.DOCKERHUB_REGISTRY_PASSWORD }}

    - name: Build (PRs)
      # Run on pull requests
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@v7.4.0
      with:
        file: ${{ matrix.dockerfile }}
        context: ${{ matrix.context }}
        target: ${{ matrix.target }}
        platforms: ${{ matrix.platforms }}
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.variant }}
        cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.variant }}-new,mode=max

    - name: Build and push
      # Publish only when Docker Hub credentials are configured.
      if: >-
        (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')) &&
        env.DOCKERHUB_REGISTRY_USER != '' &&
        env.DOCKERHUB_REGISTRY_PASSWORD != ''
      uses: docker/build-push-action@v7.4.0
      with:
        file: ${{ matrix.dockerfile }}
        context: ${{ matrix.context }}
        target: ${{ matrix.target }}
        platforms: ${{ matrix.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.variant }}
        cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.variant }}-new,mode=max

    - name: Build without publishing
      if: >-
        (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')) &&
        (env.DOCKERHUB_REGISTRY_USER == '' || env.DOCKERHUB_REGISTRY_PASSWORD == '')
      uses: docker/build-push-action@v7.4.0
      with:
        file: ${{ matrix.dockerfile }}
        context: ${{ matrix.context }}
        target: ${{ matrix.target }}
        platforms: ${{ matrix.platforms }}
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.variant }}
        cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.variant }}-new,mode=max

    # Temp fix
    # https://github.com/docker/build-push-action/issues/252
    # https://github.com/moby/buildkit/issues/1896
    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache-${{ matrix.variant }}
        mv /tmp/.buildx-cache-${{ matrix.variant }}-new /tmp/.buildx-cache-${{ matrix.variant }}

  update-draft-release:
    needs: [test, build]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      # Drafts your next Release notes as Pull Requests are merged into "master"
      - uses: release-drafter/release-drafter@v7.10.0
        with:
          config-name: release-drafter.yml
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-draft-release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Drafts your next Release notes as Pull Requests are merged into "master"
      - uses: release-drafter/release-drafter@v7.10.0
        with:
          config-name: release-drafter.yml
          publish: true
          name: ${{ github.ref_name }} # E.g. 'master' or 'v1.2.3'
          tag: ${{ github.ref_name }} # E.g. 'master' or 'v1.2.3'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-dockerhub-description:
    needs: [test, build]
    if: github.ref == 'refs/heads/dev'
    env:
      DOCKERHUB_REGISTRY_USER: ${{ secrets.DOCKERHUB_REGISTRY_USER }}
      DOCKERHUB_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_REGISTRY_PASSWORD }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Docker Hub Description
      if: env.DOCKERHUB_REGISTRY_USER != '' && env.DOCKERHUB_REGISTRY_PASSWORD != ''
      uses: peter-evans/dockerhub-description@v5.0.0
      with:
        username: ${{ secrets.DOCKERHUB_REGISTRY_USER }}
        password: ${{ secrets.DOCKERHUB_REGISTRY_PASSWORD }}
        repository: ${{ github.repository }}
        short-description: ${{ github.event.repository.description }}

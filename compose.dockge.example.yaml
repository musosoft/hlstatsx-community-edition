# Copy this file to your Dockge stack as `compose.yaml`.
# Then copy `.env.example` to `.env` and adjust values.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hlstatsxce}
      MYSQL_USER: ${MYSQL_USER:-hlstatsxce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hlstatsxce}
    volumes:
      - db-data:/var/lib/mysql
      - ${HLX_SOURCE_DIR:-.}/src/sql/install.sql:/docker-entrypoint-initdb.d/01-install.sql:ro

  daemon:
    build:
      context: ${HLX_SOURCE_DIR:-.}
      dockerfile: Dockerfile.daemon
      target: prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command:
      - --ip=0.0.0.0
      - --port=${HLX_UDP_PORT:-27500}
      - --db-host=db:3306
      - --db-name=${HLX_DB_NAME:-hlstatsxce}
      - --db-username=${HLX_DB_USER:-hlstatsxce}
      - --db-password=${HLX_DB_PASS:-hlstatsxce}
      - --nodns-resolveip
    ports:
      - ${HLX_UDP_PORT:-27500}:${HLX_UDP_PORT:-27500}/udp

  awards:
    build:
      context: ${HLX_SOURCE_DIR:-.}
      dockerfile: Dockerfile.daemon
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HLX_DB_HOST: db
      HLX_DB_PORT: "3306"
      HLX_DB_NAME: ${HLX_DB_NAME:-hlstatsxce}
      HLX_DB_USER: ${HLX_DB_USER:-hlstatsxce}
      HLX_DB_PASS: ${HLX_DB_PASS:-hlstatsxce}
      HLX_AWARDS_MAX_LAG_DAYS: ${HLX_AWARDS_MAX_LAG_DAYS:-2}
    stop_signal: SIGKILL
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
          set -eu

          cat > /awards.sh <<'EOF'
          #!/bin/sh
          set -eu
          cd /scripts
          perl hlstats-awards.pl \
            --db-host="$$HLX_DB_HOST:$$HLX_DB_PORT" \
            --db-name="$$HLX_DB_NAME" \
            --db-username="$$HLX_DB_USER" \
            --db-password="$$HLX_DB_PASS"
          EOF
          chmod +x /awards.sh

          cat > /healthcheck-awards.sh <<'EOF'
          #!/bin/sh
          set -eu
          pgrep cron >/dev/null
          latest_date="$$(
            cd /scripts
            perl -MDBI -e '
              my $$dbh = DBI->connect(
                "DBI:mysql:database=$$ENV{HLX_DB_NAME};host=$$ENV{HLX_DB_HOST};port=$$ENV{HLX_DB_PORT}",
                $$ENV{HLX_DB_USER},
                $$ENV{HLX_DB_PASS},
                { RaiseError => 0, PrintError => 0 }
              ) or exit 1;
              my ($$value) = $$dbh->selectrow_array(q{SELECT value FROM hlstats_Options WHERE keyname="awards_d_date"});
              exit 1 unless defined $$value;
              print $$value;
            '
          )"
          [ -n "$$latest_date" ]
          latest_epoch="$$(date -u -d "$$latest_date" +%s)"
          now_epoch="$$(date -u +%s)"
          age_days="$$(( (now_epoch - latest_epoch) / 86400 ))"
          [ "$$age_days" -le "$${HLX_AWARDS_MAX_LAG_DAYS:-2}" ]
          EOF
          chmod +x /healthcheck-awards.sh

          crontab - <<'EOF'
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          ${HLX_AWARDS_CRON:-0 0 * * *} /awards.sh > /proc/1/fd/1 2>/proc/1/fd/2
          EOF

          exec cron -f
    healthcheck:
      test:
        - CMD-SHELL
        - /healthcheck-awards.sh
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ${HLX_SOURCE_DIR:-.}
      dockerfile: Dockerfile.web
      target: prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_ADDR: db
      DB_NAME: ${HLX_DB_NAME:-hlstatsxce}
      DB_USER: ${HLX_DB_USER:-hlstatsxce}
      DB_PASS: ${HLX_DB_PASS:-hlstatsxce}
      DB_DEBUG: "0"
      XDEBUG_MODE: off
    ports:
      - 127.0.0.1:${HLX_WEB_PORT:-8081}:80

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
    profiles:
      - tools
    ports:
      - 127.0.0.1:${HLX_PMA_PORT:-8083}:80

volumes:
  db-data:
    name: ${DB_VOLUME_NAME:-hlstatsx_db-volume}
